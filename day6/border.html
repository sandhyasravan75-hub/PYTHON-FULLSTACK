<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        h1 {
            border: 10px;
            border-color: red ;
            border-style: solid;
            display: inline;

        }
        h1#dash {
            border: 5px dashed black;    
        }

        h2 {
            border: 3px double blue;
            display: inline;
        }
        h1#padding {
            display: inline;
            border: 5px solid red;
            padding: 5px 10px 25px 30px;
        }


    </style>
</head>
<body>
    <h1>Anantha</h1>
    <h1 id="dash">Dashed</h1>
    <h2>double</h2> <br />
    <br />
    <br />
    <br />
    <h1 id="padding">Padding</h1>
</body>
</html>
