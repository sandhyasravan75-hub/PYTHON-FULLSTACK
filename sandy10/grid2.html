<!DOCTYPE html>
<html lang="en">
<head>
        <title>Document</title>
        <style>
            .parent {
                height: 400px;
                width: 600px;
                color: white;
                font-size: 100px;
                text-align: center;
                border: 5px solid red;
                background-color: aqua;
                padding: 10px;
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                grid-template-rows: 1fr 1fr;
                gap: 10px;

            }
            .parent > div {
                background-color: blueviolet;
            
            }
            .parent > .child2,.child4,.child5 {
                grid-row: span 2;
            }

        </style>
</head>
<body>
    <div class="parent">
        <div class="div child1">1</div>
        <div class="div child2">2</div>
        <div class="div child3">3</div>
        <div class="div child4">4</div>
        <div class="div child5">5</div>
        <div class="div child6">6</div>

    </div>
</body>
</html>
