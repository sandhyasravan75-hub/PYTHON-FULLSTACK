<!doctype html>
<html lang="en">
  <head>
    <title>Document</title>
    <style>
      body {
        height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: center;
        justify-content: center;
      }
      h1 {
        border: 5px solid black;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <input id="data" type="text" placeholder="enter something" />
    <h1 id="ch"></h1>
    <h1 id="in"></h1>
    <script>
      let ele = document.getElementById("data");
      //input
      ele.addEventListener("input", function () {
        let dis = document.getElementById("in");
        dis.innerText = ele.value;
      });

      //change
      ele.addEventListener("change", function () {
        let dis = document.getElementById("ch");
        dis.innerText = ele.value;
      });

      //focus
      ele.addEventListener("focus", function () {
        document.body.style.backgroundColor = "Orange";
      });
    </script>
  </body>
</html>
