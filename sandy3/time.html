<html>
    <head>
        <title>Time Table</title>
    </head>
    <body>
        <table border="2">
            <th colspan="8">TIME TABLE</th>
            <tr>
                <th>Day</th>
                <th>9 to 10</th>
                <th>10 to 11</th>
                <th>11 to 12</th>
                <th>12 to 1</th>
                <th>1 to 2</th>
                <th>2 to 3</th>
                <th>3 to 4</th>
            </tr>
            <tr>
                <th>Mon</th>
                <td>DS</td>
                <td>AI</td>
                <td>ML</td>
                <td rowspan="7">L<br>U<br>N<br>C<br>H</td>
                <td colspan="3">AI LAB</td>
            </tr>
            <tr>
                <th>Tus</th>
                <td colspan="2">CN LAB</td>
                <td>LI</td>
                <td>DBMS</td>
                <td>AI</td>
                <td>COA</td>
            </tr>
            <tr>
                <th>Wed</th>
                <td>DAA</td>
                <td>CN</td>
                <td>ML</td>
                <td>OS</td>
                <td colspan="2">ML LAB</td>
            </tr>
            <tr>
                <th>Thus</th>
                <td colspan="3">CN LAB</td>
                <td>DBMS</td>
                <td>DAA</td>
                <td>LI</td>
            </tr>
            <tr>
                <th>Fri</th>
                <td>ML</td>
                <td>AI</td>
                <td>COA</td>
                <td colspan="3">PYTHON LAB</td>
            </tr>
            <tr>
                <th>Sat</th>
                <td colspan="2">OS LAB</td>
                <td>LI</td>
                <td>DAA</td>
                <td colspan="2">SPORTS</td>
            </tr>
        </table>
    </body>
</html>
