<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        .parent {
            height: 200px;
            width: 200px;
            border: 5px solid red;
            background-color: black;
            position: relative;
        }

        .child {
            width: 30px;
            height: 30px;
            border: 3px solid black;
            background-color: aqua;
            position:absolute;
            /*top: 50%;
            left: 50%;*/
            /*transform: translate(-50%, -50%);*/
            top: 0%;
            right: 0%;
            bottom: 0%;
    

        }
    </style>
</head>
<body>

    <div class="parent">
        <div class="child"></div>
    </div>
    
</body>
</html>
