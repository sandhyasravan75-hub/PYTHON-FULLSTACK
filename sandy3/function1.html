<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="changeBGgreen()">Green</button>
     <button onclick="changeBGblue()">blue</button>
      <button onclick="changeBGred()">red</button>
       <button onclick="changeBGblack()">black</button>
    <script>
        function changeBGgreen() {
            document.body.style="background-color:green";
        }
        function changeBGblue() {
            document.body.style="background-color:blue";
        }
        function changeBGred() {
            document.body.style="background-color:red";
        }
        function changeBGblack() {
            document.body.style="background-color:black";
        }
    </script>
</body>
</html>
