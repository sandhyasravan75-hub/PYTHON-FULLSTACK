<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .parent {
        width: 500px;
        height: 100px;
        border: 5px solid red;
        padding: 5px;
        overflow: auto;
      }
      .parent::-webkit-scrollbar {
        display: none;
      }
      .group {
        border: 5px solid black;
        width: 1200px;
        height: 90px;
        display: flex;
        gap: 10px;
        animation: sandhya 10s linear 0s infinite alternate-reverse;
      }
      .group > div {
        flex: 1 0 auto;
        background-color: blueviolet;
        color: green;
        font-size: 50px;
        text-align: center;
      }
      .group:hover {
        animation-play-state: paused;
      }
      @keyframes sandhya {
        from {
          transform: translateX(500px);
        }
        to {
          transform: translateX(-500px);
        }
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="group">
        <div class="child1">One</div>
        <div class="child2">Two</div>
        <div class="child3">Three</div>
        <div class="child4">Four</div>
        <div class="child5">Five</div>
        <div class="child6">Six</div>
        <div class="child7">Seven</div>
      </div>
    </div>
  </body>
</html>
