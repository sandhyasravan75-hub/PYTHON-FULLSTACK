<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent {
            width: 600px;
            height: 100px;
            border: 5px solid red;
            display: flex;
            gap: 5px;
        }
        .parent >  div {
            flex-grow: 1;
            width: 100px;
            height: 100px;
            background-color: blueviolet;
        }
        .parent > .child1 {
            flex-grow: 2;
        }
        .parent > .child2 {
            flex-grow: 0;
        }
        .parent> .child3 {
            flex-grow: 3;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child1"></div>
        <div class="child2"></div>
        <div class="child3"></div>
    </div>
</body>
</html>
