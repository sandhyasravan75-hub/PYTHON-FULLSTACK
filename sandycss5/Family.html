<html>
    <head>
        <title> selector</title>
        <style>
            h1 ~ p {
                color: gray;
            }
            h1 + p {
                color: blue;
            }
            #s4 {
                color: red;
            }
            #s2 {
                color: aqua;
            }
            #s3 {
                color: blueviolet;
            }
            h1 {
                background-color: pink;
                color: green;
            }
        </style>
    </head>
    <body>
        <h1>This is Narendra Family</h1>
        <p>Nari's wife Sandhya</p>
        <p id="s2">Nari's Doughter Riya</p>
        <p id="s3">Nari's Son Riyan</p>
        <p id="s4">This is my Beautiful Family.....</p>
    </body>
</html>
