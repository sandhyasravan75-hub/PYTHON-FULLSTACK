<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>Flex</title>
    <style>
        .parent {
            width: 400px;
            height: 400px;
            background-color: black;
            display: flex;
            
           
        }
        .child1 {
            width: 200px;
            height: 200px;
            background-color: aqua;
            color: green;
        }
        
        .child2 {
            width: 200px;
            height: 200px;
            background-color: blueviolet;
            color: green;
        }
        
        .child3 {
            width: 200px;
            height: 200px;
            background-color: red;
            color: green;
        }
        
    </style>
</head>
<body>
    <div class="parent">
    <div class="child1">1</div>
    <div class="child2">2</div>
    <div class="child3">3</div>
    </div>
</body>
</html>
