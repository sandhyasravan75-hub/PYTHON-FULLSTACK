<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        .parent {
            height: 200px;
            width: 200px;
            background-color: blue;
            border: 10px solid green;
        }
        .parent:hover {
            background-color: pink;
            border-radius: 100%;
            transition-duration: 5s;
            transform: translate(500px,400px);
        }

    </style>
</head>
<body>
    <div class="parent"></div>
</body>
</html>
